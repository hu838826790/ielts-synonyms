<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>雅思听力同义词训练 · 嘉兴辰星留学-HU</title>
<style>
:root{
  --bg:#eef2fb; --card:#ffffff; --ink:#1e2749; --sub:#6b7394; --line:#e3e8f5;
  --brand:#4f6ef7; --brand2:#8b5cf6; --ok:#16a34a; --bad:#ef4444; --warn:#f59e0b;
  --shadow:0 10px 30px rgba(79,110,247,.12);
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); min-height:100vh;
}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 96px}

/* ---------- header ---------- */
header.app{
  position:sticky;top:0;z-index:30;backdrop-filter:blur(12px);
  background:linear-gradient(135deg,rgba(79,110,247,.95),rgba(139,92,246,.95));
  color:#fff;box-shadow:0 4px 18px rgba(79,110,247,.35);
}
header.app .inner{max-width:760px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:10px}
header.app h1{font-size:18px;margin:0;letter-spacing:.5px}
header.app .brand-line{font-size:11px;opacity:.88;margin-top:2px;letter-spacing:.3px}
.app-footer{text-align:center;color:#a5adcc;font-size:12px;padding:18px 0 6px;line-height:1.7}
header.app .badge{font-size:12px;background:rgba(255,255,255,.22);padding:3px 10px;border-radius:999px;white-space:nowrap}

/* ---------- tabs ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(30,39,73,.08)}
nav.tabs .inner{max-width:760px;margin:0 auto;display:flex}
nav.tabs button{
  flex:1;border:none;background:none;padding:9px 4px 10px;font-size:11px;color:var(--sub);
  display:flex;flex-direction:column;align-items:center;gap:3px;border-top:3px solid transparent;
}
nav.tabs button .ic{font-size:20px;line-height:1}
nav.tabs button.on{color:var(--brand);border-top-color:var(--brand);font-weight:600}
nav.tabs button .cnt{font-size:10px;background:var(--bad);color:#fff;border-radius:999px;padding:0 5px;margin-left:2px}

/* ---------- cards & generic ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;border:1px solid #f0f3fb}
.card h3{margin:0 0 8px;font-size:15px}
.muted{color:var(--sub);font-size:13px;line-height:1.6}
.grow{flex:1}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.btn{
  border:none;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:600;color:#fff;
  background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 6px 16px rgba(79,110,247,.28);
  transition:transform .06s, filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--brand);box-shadow:none}
.btn.soft{background:#eef1fe;color:var(--brand);box-shadow:none}
.btn.ok{background:linear-gradient(135deg,#22c55e,#16a34a);box-shadow:0 6px 16px rgba(22,163,74,.25)}
.btn.bad{background:linear-gradient(135deg,#f87171,#ef4444);box-shadow:0 6px 16px rgba(239,68,68,.25)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.pill{display:inline-block;background:#eef1fe;color:var(--brand);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.pill.green{background:#e7f8ee;color:#15803d}
.pill.red{background:#fdecec;color:#b91c1c}
.pill.amber{background:#fef4e0;color:#b45309}
.tag{display:inline-block;background:#f1f3fb;color:var(--sub);border-radius:8px;padding:2px 8px;font-size:12px;margin:2px 3px 2px 0}
.speak-btn{background:#eef1fe;border:none;border-radius:10px;width:34px;height:34px;font-size:16px;color:var(--brand);display:inline-flex;align-items:center;justify-content:center}
.speak-btn:active{transform:scale(.92)}
.center{text-align:center}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}

/* ---------- home ---------- */
.hero{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:20px;padding:22px;box-shadow:0 14px 34px rgba(79,110,247,.35)}
.hero .big{font-size:40px;font-weight:800;line-height:1.1}
.hero .small{font-size:13px;opacity:.9;margin-top:6px}
.ringbox{position:relative;width:128px;height:128px;margin:0 auto}
.ringbox svg{transform:rotate(-90deg)}
.ringbox .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringbox .num b{font-size:30px}
.ringbox .num span{font-size:12px;color:var(--sub)}

/* ---------- mode cards ---------- */
.mode-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;border:2px solid transparent;cursor:pointer;transition:border-color .15s}
.mode-card:hover{border-color:var(--brand)}
.mode-card.on{border-color:var(--brand);background:#f6f8ff}
.mode-card .ic{font-size:30px}
.mode-card b{display:block;font-size:15px;margin-top:6px}
.mode-card .d{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.5}
.submode-row{display:flex;gap:8px;flex-wrap:wrap}
.submode-row .btn{padding:8px 14px;font-size:13px}
.submode-row .btn.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 4px 12px rgba(79,110,247,.3)}

/* ---------- quiz ---------- */
.quiz-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.quiz-top .step{font-size:13px;color:var(--sub);white-space:nowrap}
.progress{flex:1;height:8px;background:#e9edf8;border-radius:99px;overflow:hidden}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px;transition:width .3s}
.q-word{font-size:34px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap}
.q-phon{font-size:15px;color:var(--sub);text-align:center;margin-top:2px;font-family:"Times New Roman",serif}
.q-meaning{font-size:22px;font-weight:700;text-align:center;margin:6px 0}
.opt{display:block;width:100%;text-align:left;background:#f6f8ff;border:1.5px solid #e2e8f8;border-radius:12px;padding:13px 14px;font-size:15px;color:var(--ink);margin-bottom:10px;transition:.12s;cursor:pointer}
.opt:active{transform:scale(.99)}
.opt.right{border-color:var(--ok);background:#eafaf1;color:#14532d}
.opt.wrong{border-color:var(--bad);background:#fef0f0;color:#7f1d1d}
.opt.locked{cursor:default}
.type-input{width:100%;border:2px solid #dfe5f5;border-radius:12px;padding:14px;font-size:20px;text-align:center;letter-spacing:1.5px;outline:none}
.type-input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,110,247,.15)}
.fb{background:#f6f8ff;border:1.5px solid #e2e8f8;border-radius:14px;padding:14px}
.fb .word{font-size:24px;font-weight:800}
.fb .syn{color:var(--sub);font-size:13px;line-height:1.7}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.fade-in{animation:fadein .25s}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- fill blanks ---------- */
.fillword{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:10px 0}
.fillword .ch{width:34px;height:44px;border:2px solid #dfe5f5;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;background:#fff}
.fillword .ch.blank{background:#fff}
.fillword input.ch{text-align:center;outline:none;font-size:22px;color:var(--brand);width:36px;height:46px;padding:0}
.fillword input.ch:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,110,247,.15)}
.fillword .sp{width:14px;border:none;box-shadow:none;background:none}
.fillword .ch.done{border-color:var(--ok);color:var(--ok);background:#eafaf1}
.fillword .ch.fail{border-color:var(--bad);color:var(--bad);background:#fef0f0}

/* ---------- matching ---------- */
.match-col{display:flex;flex-direction:column;gap:9px}
.match-item{background:#fff;border:2px solid #e2e8f8;border-radius:12px;padding:11px 13px;font-size:15px;font-weight:600;cursor:pointer;transition:.12s;box-shadow:0 3px 10px rgba(30,39,73,.06)}
.match-item:hover{border-color:var(--brand)}
.match-item.sel{border-color:var(--brand);background:#f0f4ff;box-shadow:0 0 0 3px rgba(79,110,247,.15)}
.match-item.paired{border-color:var(--ok);background:#eafaf1;color:#14532d;cursor:default}
.match-item.paired.wrong{border-color:var(--bad);background:#fef0f0;color:#7f1d1d}

/* ---------- glossary ---------- */
.search{width:100%;border:2px solid #dfe5f5;border-radius:12px;padding:12px 14px;font-size:15px;outline:none}
.search:focus{border-color:var(--brand)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.filters .btn{white-space:nowrap;padding:7px 12px;font-size:12px;border-radius:999px}
.filters .btn.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.gword{background:#fff;border:1px solid #eef1fb;border-radius:14px;padding:12px 14px;box-shadow:0 4px 12px rgba(30,39,73,.05)}
.gword .top{display:flex;align-items:center;gap:8px}
.gword .w{font-size:18px;font-weight:700}
.gword .num{font-size:11px;color:#a5adcc}
.gword .phon{font-size:14px;color:var(--sub);font-family:"Times New Roman",serif}
.gword .mn{font-size:14px;margin-top:4px}
.gword .syns{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.6}
.dot{width:9px;height:9px;border-radius:99px;display:inline-block;flex:none}
.dot.m{background:var(--ok)} .dot.p{background:var(--warn)} .dot.n{background:#cbd2e8}

.mini-spk{font-style:normal;font-size:11px;cursor:pointer;opacity:.75;padding:0 3px;border-radius:6px;user-select:none;line-height:1.4;display:inline-block}
.mini-spk:hover{opacity:1;background:#e6ebff}
.syn-tag{display:inline-flex;align-items:center;gap:3px;vertical-align:middle}
.opt .row, .match-item .row{width:100%}
.audio-big{display:inline-flex;align-items:center;gap:6px;background:#eef1fe;border:1.5px solid #dfe5f8;color:var(--brand);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600}
.q-word .speak-btn{width:44px;height:44px;font-size:22px;border-radius:12px}
.q-word .qword-txt{cursor:pointer;border-bottom:2px dashed rgba(79,110,247,.4);padding-bottom:2px}
.qword-txt:hover{color:var(--brand)}
.audio-big:active{transform:scale(.97)}

/* ---------- overview ---------- */
.g4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:520px){.g4{grid-template-columns:repeat(4,1fr)}}
.ov-stat{background:#fff;border-radius:14px;padding:12px;text-align:center;box-shadow:0 4px 12px rgba(30,39,73,.06)}
.ov-stat b{display:block;font-size:22px}
.ov-stat span{font-size:11px;color:var(--sub)}
.statusbar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:#e9edf8}
.statusbar i{display:block;height:100%}
.table-wrap{overflow-x:auto;border-radius:14px;box-shadow:var(--shadow);background:#fff;border:1px solid #f0f3fb}
table.ov{width:100%;border-collapse:collapse;font-size:13px;min-width:860px}
table.ov th{position:sticky;top:0;background:#f6f8ff;color:var(--sub);font-weight:600;text-align:left;padding:10px 10px;border-bottom:2px solid #e2e8f8;white-space:nowrap;font-size:12px;z-index:1}
table.ov td{padding:7px 10px;border-bottom:1px solid #f0f3fb;vertical-align:middle}
table.ov tbody tr:hover td{background:#f8faff}
table.ov .w{font-weight:700;font-size:14px}
table.ov .phon{font-family:"Times New Roman",serif;color:var(--sub);font-size:12px;white-space:nowrap}
.minibar{width:70px;height:7px;background:#e9edf8;border-radius:99px;overflow:hidden;display:inline-block;vertical-align:middle}
.minibar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.syncell{max-width:240px;line-height:1.5}
.syncell .tag{font-size:11px;margin:1px 2px 1px 0}
.speak-btn.sm{width:26px;height:26px;font-size:13px;border-radius:8px}

/* ---------- misc ---------- */
.section-title{font-size:14px;font-weight:700;color:var(--sub);margin:18px 4px 10px;display:flex;align-items:center;gap:6px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#fff;border-radius:14px;padding:12px;text-align:center;box-shadow:0 4px 12px rgba(30,39,73,.06)}
.stat b{display:block;font-size:22px}
.stat span{font-size:11px;color:var(--sub)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #f0f3fb}
.set-row:last-child{border-bottom:none}
.set-row label{font-size:14px}
.set-row .sub{font-size:12px;color:var(--sub)}
select, input[type=number], input[type=range]{border:1.5px solid #dfe5f5;border-radius:10px;padding:8px 10px;font-size:14px;background:#fff;color:var(--ink)}
input[type=range]{padding:0;accent-color:var(--brand)}
.toggle{position:relative;width:46px;height:26px;flex:none;border-radius:99px;background:#d7ddf0;transition:.2s;border:none}
.toggle.on{background:var(--brand)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:99px;background:#fff;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.toggle.on::after{left:23px}
.empty{text-align:center;color:var(--sub);padding:30px 10px;font-size:14px}
.bigemoji{font-size:44px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-80px);background:#1e2749;color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;z-index:99;transition:.25s;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.hidden{display:none!important}
@media (max-width:480px){
  .g2{grid-template-columns:1fr}
  .q-word{font-size:28px}
}
</style>
</head>
<body>
<div id="toast" class="toast"></div>

<header class="app">
  <div class="inner">
    <div class="grow">
      <h1>🎧 雅思听力同义词训练</h1>
      <div class="brand-line" id="brandLine"></div>
    </div>
    <span class="badge" id="headBadge">考点词 179</span>
  </div>
</header>

<main class="wrap">
  <!-- 首页 -->
  <section id="view-home"></section>
  <!-- 词汇表 -->
  <section id="view-glossary" class="hidden"></section>
  <!-- 总览 -->
  <section id="view-overview" class="hidden"></section>
  <!-- 训练 -->
  <section id="view-train" class="hidden"></section>
  <!-- 进度 -->
  <section id="view-progress" class="hidden"></section>
  <!-- 设置 -->
  <section id="view-settings" class="hidden"></section>
  <footer class="app-footer" id="appFooter"></footer>
</main>

<nav class="tabs">
  <div class="inner">
    <button data-tab="home" class="on"><span class="ic">🏠</span>首页</button>
    <button data-tab="glossary"><span class="ic">📖</span>词汇表</button>
    <button data-tab="overview"><span class="ic">📋</span>总览</button>
    <button data-tab="train"><span class="ic">🎯</span>训练</button>
    <button data-tab="progress"><span class="ic">📊</span>进度<span class="cnt hidden" id="wrongCnt"></span></button>
    <button data-tab="settings"><span class="ic">⚙️</span>设置</button>
  </div>
</nav>

<script src="audio_index.js"></script>

  const a = norm(answer), w = norm(word);

const LS_KEY = 'ielts_syn_train_v1';
const defaultState = () => ({

  words:{},   // id -> {seen, spR, spW, meR, meW, syR, syW, fillR, fillW, last}

});
let S = loadState();
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return defaultState();
    const d = Object.assign(defaultState(), JSON.parse(raw));
    d.settings = Object.assign(defaultState().settings, d.settings||{});
    d.words = d.words||{}; d.history = d.history||[];
    return d;
  }catch(e){ return defaultState(); }
}

function wordStat(id){
  if(!S.words[id]) S.words[id] = {seen:0,spR:0,spW:0,meR:0,meW:0,syR:0,syW:0,fillR:0,fillW:0,last:0};
  return S.words[id];
}
/* 掌握度：0-1，权重 书写50% 中文25% 同义25%（填空并入书写） */
function mastery(id){
  const w = S.words[id]; if(!w || w.seen===0) return 0;
  const spT = w.spR+w.spW, meT = w.meR+w.meW, syT = w.syR+w.syW, flT = w.fillR+w.fillW;
  const sp = spT ? w.spR/spT : 0, me = meT ? w.meR/meT : 0, sy = syT ? w.syR/syT : 0, fl = flT ? w.fillR/flT : 0;
  let score = 0, total = 0;
  if(spT){ score += sp*0.5; total += .5; }
  if(meT){ score += me*0.25; total += .25; }
  if(syT){ score += sy*0.25; total += .25; }
  if(flT){ score += fl*0.5; total += .5; }
  return total ? score/total : 0;
}
const masteredIds = () => DATA.filter(e => mastery(e.id)>=0.75 && wordStat(e.id).seen>=3).map(e=>e.id);
const wrongIds = () => DATA.filter(e => {
  const w = S.words[e.id]; if(!w) return false;
  const bad = w.spW+w.meW+w.syW+w.fillW;
  return bad>0 && mastery(e.id)<0.75;
}).map(e=>e.id).sort((a,b)=> (S.words[b].spW+S.words[b].meW+S.words[b].syW+S.words[b].fillW) - (S.words[a].spW+S.words[a].meW+S.words[a].syW+S.words[a].fillW));

/* ================= 发音 ================= */
let VOICES = [];
function populateVoiceSelect(){
  const sel = document.getElementById('voiceSel'); if(!sel || !VOICES.length) return;
  const cur = sel.value;
  sel.innerHTML = '';
  const en = VOICES.filter(v=>/^en/i.test(v.lang));
  (en.length?en:VOICES).forEach(v=>{
    const o=document.createElement('option'); o.value=v.voiceURI; o.textContent=`${v.name} (${v.lang})`;
    sel.appendChild(o);
  });
  if(cur && [...sel.options].some(o=>o.value===cur)) sel.value=cur;
  else if(S.settings.voiceURI && [...sel.options].some(o=>o.value===S.settings.voiceURI)) sel.value=S.settings.voiceURI;
}
function loadVoices(){
  if(!('speechSynthesis' in window)) return;
  VOICES = speechSynthesis.getVoices();
  populateVoiceSelect();
  speechSynthesis.onvoiceschanged = () => { VOICES = speechSynthesis.getVoices(); populateVoiceSelect(); };
}
let _curUtter = null;   // 保持对当前 utterance 的引用，防止 WebKit/Safari 在播放结束前回收
let _keepAlive = null;  // Chromium 语音引擎保活定时器（已知 bug：长时间/第二次可能没声音）
function hasTTS(){
  try{
    if(!('speechSynthesis' in window) || !window.speechSynthesis) return false;
    const v = window.speechSynthesis.getVoices();
    return !!(v && v.length > 0);
  }catch(e){ return false; }
}
/* ---- 预录音频引擎（离线语音包，任何浏览器都能出声；含全部 179 词 + 全部同义词） ---- */
let _audioEl = null;
function loadAudioChunk(idx, cb){
  const s = document.createElement('script');
  s.src = 'audio_' + idx + '.js';
  s.onload = s.onerror = () => { if(cb) cb(); };
  (document.head || document.body).appendChild(s);
}
function playDataURL(url, rate){
  try{
    if(typeof Audio === 'undefined'){ toast('当前环境不支持音频播放'); return; }
    if(_audioEl){ _audioEl.pause(); _audioEl.src = ''; }
    _audioEl = _audioEl || new Audio();
    _audioEl.src = url;
    _audioEl.playbackRate = Math.max(0.5, Math.min(2, (rate || S.settings.rate || 1)));
    _audioEl.play().catch(()=>{});
  }catch(e){ toast('音频播放失败'); }
}
function playEmbedded(text, rate){
  const A = window.AUDIO || {};
  if(A[text]){ playDataURL(A[text], rate); return true; }
  const total = window.AUDIO_TOTAL || 0;
  const map = window.AUDIO_MAP || {};
  const idx = map[text];
  if(total > 0 && idx !== undefined && idx !== null){
    toast('正在加载语音…');
    loadAudioChunk(idx, ()=>{
      const u2 = (window.AUDIO || {})[text];
      if(u2) playDataURL(u2, rate);
      else toast('该词暂无预录音频');
    });
    return true;
  }
  return false;
}
function speak(text, rate){
  const engine = S.settings.engine || 'auto';
  if(engine === 'embedded'){
    if(!playEmbedded(text, rate)) toast('该词暂无预录音频');
    return;
  }
  if(engine === 'system'){
    if(hasTTS()) speakSystem(text, rate);
    else toast('当前浏览器不支持系统语音，请切换到「预录音频」');
    return;
  }
  // auto：预录音频优先（<audio> 可反复点击重播，不受 Safari 语音 bug 影响）；包内没有的词才用系统语音
  if(playEmbedded(text, rate)) return;
  if(hasTTS()){ speakSystem(text, rate); return; }
  toast('当前浏览器不支持语音朗读');
}
function speakSystem(text, rate){
  if(!('speechSynthesis' in window)){ toast('当前浏览器不支持语音朗读'); return; }
  const tts = window.speechSynthesis || speechSynthesis;
  clearTimeout(speak._t);
  if(_keepAlive){ clearInterval(_keepAlive); _keepAlive = null; }
  // 预热语音列表（部分引擎需要先加载语音才能持续朗读）
  try{ if(VOICES.length===0 && tts.getVoices) VOICES = tts.getVoices(); }catch(e){}
  const busy = !!(tts.speaking || tts.pending);
  const doSpeak = () => {
    const u = new SpeechSynthesisUtterance(text);
    const want = S.settings.voiceURI;
    const v = VOICES.find(x=>x.voiceURI===want) || VOICES.find(x=>/^en[-_]/i.test(x.lang));
    if(v) u.voice = v;
    u.lang = v? v.lang : 'en-GB';
    u.rate = rate || S.settings.rate;
    u.pitch = 1;
    _curUtter = u; // 保持引用，防止被回收
    u.onend = u.onerror = () => {
      if(_keepAlive){ clearInterval(_keepAlive); _keepAlive = null; }
      if(_curUtter === u) _curUtter = null;
    };
    try{ tts.speak(u); }catch(e){}
    // Chromium 已知 bug：说话期间定期 pause/resume 保持引擎不卡死，否则第二次点击可能没声音
    if(!_keepAlive){
      _keepAlive = setInterval(()=>{
        try{
          if(tts.speaking || tts.pending){ tts.pause(); tts.resume(); }
          else { clearInterval(_keepAlive); _keepAlive = null; }
        }catch(e){ clearInterval(_keepAlive); _keepAlive = null; }
      }, 8000);
    }
  };
  if(busy){
    // 正在朗读：先取消，等引擎真正停下再读新的（WebKit bug：cancel 后立即 speak 事件会失效）
    try{ tts.cancel(); }catch(e){}
    const waitIdle = () => {
      if(tts.speaking || tts.pending){ speak._t = setTimeout(waitIdle, 50); }
      else doSpeak();
    };
    speak._t = setTimeout(waitIdle, 60);
  } else {
    // 空闲：直接（下一帧）朗读，不做多余 cancel（避免触发 WebKit bug）
    speak._t = setTimeout(doSpeak, 0);
  }
}

/* 答题音效：用 Web Audio 合成，完全离线 */
let audioCtx = null;
function ensureAudio(){
  if(audioCtx) return audioCtx;
  try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx=null; }
  return audioCtx;
}
function tone(ctx, freq, t0, dur, type, vol){
  try{
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0); o.stop(t0+dur+0.05);
  }catch(e){}
}
function playCorrect(){
  const ctx = ensureAudio(); if(!ctx || !S.settings.sound) return;
  if(ctx.state==='suspended') ctx.resume();
  const t = ctx.currentTime + 0.02;
  tone(ctx, 523.25, t,     0.18, 'triangle', 0.24);   // C5
  tone(ctx, 659.25, t+0.10, 0.18, 'triangle', 0.24);  // E5
  tone(ctx, 783.99, t+0.20, 0.34, 'triangle', 0.26);  // G5
}
function playWrong(){
  const ctx = ensureAudio(); if(!ctx || !S.settings.sound) return;
  if(ctx.state==='suspended') ctx.resume();
  const t = ctx.currentTime + 0.02;
  tone(ctx, 196, t,     0.22, 'sawtooth', 0.10);      // G3
  tone(ctx, 147, t+0.15, 0.36, 'sawtooth', 0.10);      // D3
}

/* 生成单选题干扰项 */
function distractorIds(correctId, n, pool){
  pool = pool || DATA.map(e=>e.id);
  const out = new Set([correctId]);
  const cand = shuffle(pool.filter(i=>i!==correctId));
  for(const c of cand){
    if(out.size >= n) break;
    out.add(c);
  }
  return [...out];
}
function meaningOptions(id, n=4){
  const e = entryById(id);
  const pool = [e.id];
  const cand = shuffle(DATA.filter(ent=>ent.id!==id && ent.meaning !== e.meaning));
  for(const ent of cand){ if(pool.length>=n) break; pool.push(ent.id); }
  return shuffle(pool.map(i=>({id:i, text:entryById(i).meaning})));
}
function synOptions(entry, n=4){
  const correct = sample(entry.synonyms,1)[0];
  const dist = [];
  const cand = shuffle(DATA.filter(e=>e.id!==entry.id));
  for(const e of cand){
    if(dist.length >= n-1) break;
    const s = sample(e.synonyms,1)[0];
    if(s !== correct && !dist.includes(s)) dist.push(s);
  }
  const opts = shuffle([{text:correct, right:true}, ...dist.map(s=>({text:s, right:false}))]);
  return {opts, correct};
}
/* 反向：给同义词找考点词 */
function reverseOptions(entry, n=4){
  const correct = sample(entry.synonyms,1)[0];
  const dist = [];
  const cand = shuffle(DATA.filter(e=>e.id!==entry.id && !e.synonyms.includes(correct)));
  for(const e of cand){
    if(dist.length >= n-1) break;
    dist.push(e);
  }
  if(dist.length < n-1) return null; // 干扰项不足，改用正向
  const opts = shuffle([{id:entry.id, text:entry.word, right:true}, ...dist.map(e=>({id:e.id, text:e.word, right:false}))]);
  return {opts, correct};
}

function renderGlossary(){
  const groups = groupRanges();

  $('view-glossary').innerHTML = `

    <div id="glossList" class="mt8" style="display:flex;flex-direction:column;gap:10px"></div>
  `;
  const sr = $('glossSearch');
  sr.addEventListener('input',()=>{ glossQuery=sr.value; drawGlossList(); });
  document.querySelectorAll('#view-glossary .filters .btn').forEach(b=>b.addEventListener('click',()=>{ glossFilter=b.dataset.f; renderGlossary(); }));
  drawGlossList();
}
function groupRanges(){
  const groups = [[1,25],[26,51],[52,79],[80,107],[108,136],[137,163],[164,179]];
  return groups.map((g,i)=>({i:i+1, from:g[0], to:g[1]}));
}
function drawGlossList(){
  const q = glossQuery.trim().toLowerCase();
  const list = $('glossList'); if(!list) return;
  const groups = groupRanges();
  let ids = DATA.map(e=>e.id);
  if(glossFilter==='unmastered') ids = ids.filter(id=>!masteredIds().includes(id));
  if(glossFilter==='wrong') ids = wrongIds();
  const gm = glossFilter.match(/^g(\d)$/);
  if(gm){ const g=groups[+gm[1]-1]; ids = ids.filter(id=>id>=g.from && id<=g.to); }
  if(q){
    ids = ids.filter(id=>{
      const e = entryById(id);
      return e.word.toLowerCase().includes(q) || e.meaning.includes(q) || e.synonyms.some(s=>s.toLowerCase().includes(q)) || e.phonetic.toLowerCase().includes(q);
    });
  }
  if(!ids.length){ list.innerHTML = `<div class="empty"><div class="bigemoji">🔍</div>没有找到匹配的考点词</div>`; return; }
  const mastered = new Set(masteredIds());
  list.innerHTML = ids.map(id=>{
    const e = entryById(id); const m = mastery(id);
    const mst = mastered.has(id);
    const dot = mst ? '<span class="dot m"></span>' : (S.words[id] && S.words[id].seen ? '<span class="dot p"></span>' : '<span class="dot n"></span>');
    const pct = Math.round(m*100);
    return `<div class="gword fade-in">
      <div class="top">
        <span class="num">#${e.id}</span>${dot}
        <span class="w">${esc(e.word)}</span>
        <span class="pill">${esc(POS_CN[e.pos]||e.pos||'短语')}</span>
        ${e.pos?'':'<span class="pill amber">短语</span>'}
        <span class="grow"></span>
        ${speakBtn(e.id, e.word)}
      </div>
      <div class="phon">/${esc(e.phonetic)}/</div>
      <div class="mn">${esc(e.meaning)}</div>
      <div class="syns">🔁 <b style="color:#4f6ef7">真题同义替换：</b>${e.synonyms.map(s=>`<span class="tag syn-tag">${esc(s)}${spkMini(s)}</span>`).join('')}</div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
        <div class="progress" style="height:6px"><i style="width:${pct}%"></i></div>
        <span style="font-size:11px;color:var(--sub);white-space:nowrap">${mst?'✅ 已掌握':(S.words[id]?pct+'%':'未学')}</span>
      </div>
    </div>`;
  }).join('');
}

const MODE_META = {
  dict:{ic:'🎧',name:'听写',desc:'听发音 → 写单词 → 选中文 → 选同义',color:''},
  recall:{ic:'✍️',name:'默写',desc:'看中文/音标 → 凭记忆写单词'},

  fill:{ic:'🧩',name:'拆词填空',desc:'去掉若干字母 → 填空补全'}
};

function renderTrainSetup(){
  const groups = groupRanges();
  const scopeOpts = [['all','全部 179'],['unmastered','未掌握'],['wrong','错词'],...groups.map(g=>[`g${g.i}`,`组${g.i}`])];

  $('view-train').innerHTML = `

    <div class="grid g2">
      ${Object.entries(MODE_META).map(([k,m])=>`
        <div class="mode-card ${trainMode===k?'on':''}" data-m="${k}">
          <span class="ic">${m.ic}</span><b>${m.name}</b><div class="d">${m.desc}</div>
        </div>`).join('')}
    </div>
    <div id="synSubWrap" class="mt8 ${trainMode==='syn'?'':'hidden'}">
      <div class="submode-row">
        <button class="btn soft ${synSub==='fwd'?'on':''}" data-s="fwd">考点词 → 同义词</button>
        <button class="btn soft ${synSub==='rev'?'on':''}" data-s="rev">同义词 → 考点词</button>

    <div class="section-title">${trainMode==='recall'?'③ 每轮默写单词数':'③ 每轮题数'}</div>
    <div class="filters">${countOpts.map(c=>`<button class="btn soft ${trainCount===c?'on':''}" data-c="${c}">${c==='all'?'全部':(trainMode==='recall'?'默写 '+c+' 个单词':'每轮 '+c+' 题')}</button>`).join('')}</div>

    <div class="card mt16 center" style="background:linear-gradient(135deg,#f6f8ff,#eef1fe);border:1.5px dashed #c9d3f5">
      <div class="muted" style="font-size:13px">听写与默写全程<b>不显示任何临摹提示</b>，凭耳朵与记忆完成。</div>
      <button class="btn mt8" style="min-width:220px" onclick="startSession()">🚀 开始训练</button>
    </div>
  `;
  document.querySelectorAll('#view-train .mode-card').forEach(c=>c.addEventListener('click',()=>{ trainMode=c.dataset.m; renderTrainSetup(); }));
  document.querySelectorAll('#synSubWrap .btn').forEach(b=>b.addEventListener('click',()=>{ synSub=b.dataset.s; renderTrainSetup(); }));
  document.querySelectorAll('#view-train .filters .btn').forEach(b=>{
    b.addEventListener('click',()=>{
      if(b.dataset.sc){ trainScope=b.dataset.sc; S.settings.scope=trainScope; save(); }
      if(b.dataset.c){ trainCount = b.dataset.c==='all'?'all':+b.dataset.c; S.settings.count=trainCount; save(); }
      renderTrainSetup();
    });
  });
}

function scopeIds(){
  if(trainScope==='unmastered') return DATA.filter(e=>!masteredIds().includes(e.id)).map(e=>e.id);
  if(trainScope==='wrong') return wrongIds();
  const gm = String(trainScope).match(/^g(\d)$/);
  if(gm){ const g=groupRanges()[+gm[1]-1]; return DATA.filter(e=>e.id>=g.from&&e.id<=g.to).map(e=>e.id); }
  return DATA.map(e=>e.id);
}
function buildItems(){
  let ids = scopeIds();
  if(trainCount!=='all' && trainCount>0) ids = sample(ids, Math.min(trainCount, ids.length));
  if(!ids.length) return [];
  if(trainMode==='mix'){
    const steps=['dict','recall','syn','fill'];
    return ids.map((id,i)=>({id, step:steps[i%4]}));
  }
  if(trainMode==='syn' && synSub==='rev'){
    const items=[];
    for(const id of ids){
      const r = reverseOptions(entryById(id));
      if(r) items.push({id, step:'synr'});
      else items.push({id, step:'syn'});
    }
    return items;
  }
  if(trainMode==='syn' && synSub==='pair') return ids.map(id=>({id, step:'pair'}));
  return ids.map(id=>({id, step:trainMode}));
}

function startSession(){
  const items = buildItems();
  if(!items.length){ toast('当前范围没有可训练的单词'); return; }
  SESSION = {mode:trainMode, items, idx:0, score:0, total:items.length, results:[]};
  renderSession();
}
function startQuick(which){
  if(which==='dict') trainMode='dict';
  else if(which==='recall') trainMode='recall';
  else if(which==='wrong'){ trainMode='dict'; trainScope='wrong'; }
  else if(which==='mix') trainMode='mix';
  renderTrainSetup();
  startSession();
}

function renderSession(){
  const root = $('view-train');
  const item = SESSION.items[SESSION.idx];
  const e = entryById(item.id);
  // stats update & render
  const pct = Math.round(SESSION.idx/SESSION.total*100);
  const meta = (item.step==='synr'||item.step==='pair') ? MODE_META.syn : (MODE_META[item.step] || MODE_META.dict);
  root.innerHTML = `
    <div class="quiz-top">
      <button class="btn ghost sm" onclick="quitSession()">✕ 退出</button>
      <span class="step">${meta.ic} ${meta.name} · ${SESSION.idx+1}/${SESSION.total}</span>
      <span class="step" style="color:var(--ok)">✓ ${SESSION.score}</span>
    </div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div id="qcard" class="mt16"></div>
  `;
  const qc = $('qcard');
  if(item.step==='dict') renderDict(qc, e);
  else if(item.step==='recall') renderRecall(qc, e);
  else if(item.step==='syn') renderSyn(qc, e);
  else if(item.step==='synr') renderSynR(qc, e);
  else if(item.step==='fill') renderFill(qc, e);
  else if(item.step==='pair') renderPairBoard(qc);
}

/* ---------- 拆词填空 ---------- */
function genFill(word){
  const letters = word.split('');
  const idxs = [];
  letters.forEach((ch,i)=>{ if(/[a-zA-Z]/.test(ch)) idxs.push(i); });
  const level = S.settings.fillLevel || 'mid';
  let pos=[];
  if(level==='mid'){
    pos = idxs.filter(i=>/[aeiouAEIOU]/.test(letters[i]));
    if(!pos.length) pos = sample(idxs, Math.min(2, idxs.length));
  } else if(level==='easy'){
    const n = idxs.length>=8 ? 2 : 1;
    pos = sample(idxs, Math.min(n, idxs.length));
  } else {
    const n = Math.min(idxs.length-1, 3 + Math.floor(Math.random()*2));
    pos = sample(idxs, Math.max(2, n));
  }
  pos.sort((a,b)=>a-b);
  return {positions:pos, blanks:pos.map(i=>letters[i]), letters};
}
function renderFill(qc, e){
  const st = wordStat(e.id); st.seen++;
  save();
  const f = genFill(e.word);
  const blanks = f.positions.length;
  qc.innerHTML = `
    <div class="card">
      <div class="center">
        <div class="muted" style="font-size:12px">第 ${SESSION.idx+1} 题 · 拆词填空（已去掉 ${blanks} 个字母）</div>
        <div class="q-meaning" style="margin-top:8px">${esc(e.meaning)}</div>
        <div style="display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap">

          ${S.settings.showPhon?`<span class="pill" style="font-family:'Times New Roman',serif">/${esc(e.phonetic)}/</span>`:''}
        </div>

          <button class="audio-big" onclick="speak(${JSON.stringify(e.word)}, undefined)">🔊 听单词读音</button>
          <button class="btn sm soft" onclick="speak(${JSON.stringify(e.word)}, 0.6)">🐢 慢速</button>
        </div>
        <div class="muted mt8" style="font-size:12px">先听读音、看中文，再填空补全</div>
      </div>
      <div class="fillword" id="fillword">${f.letters.map((ch,i)=>{
        if(ch===' ') return `<span class="ch sp"></span>`;
        if(f.positions.includes(i)) return `<input class="ch" maxlength="1" data-pos="${i}" aria-label="填空">`;
        return `<span class="ch">${esc(ch)}</span>`;
      }).join('')}</div>
      <div class="row" style="justify-content:center">
        <button class="btn" onclick="checkFill()">提交</button>
      </div>
    </div>`;
  const inputs = [...qc.querySelectorAll('input.ch')];
  const first = inputs[0]; if(first) first.focus();
  inputs.forEach(inp=>{
    inp.addEventListener('input', ()=>{
      if(inp.value) { const nxt = inputs[inputs.indexOf(inp)+1]; if(nxt) nxt.focus(); }
    });
    inp.addEventListener('keydown', ev=>{
      if(ev.key==='Backspace' && !inp.value){ const prev = inputs[inputs.indexOf(inp)-1]; if(prev) prev.focus(); }
    });
  });
  if(S.settings.autoPlay) setTimeout(()=>speak(e.word, undefined), 350);
}
function checkFill(){
  const e = entryById(SESSION.items[SESSION.idx].id);
  const f = genFill(e.word);
  const inputs = [...document.querySelectorAll('#fillword input.ch')];
  const got = inputs.map(i=>i.value.toLowerCase());
  const want = f.blanks.map(b=>b.toLowerCase());
  const ok = got.length===want.length && got.every((g,i)=>g===want[i]);
  const st = wordStat(e.id);
  if(ok){ st.fillR++; playCorrect(); } else { st.fillW++; playWrong(); }
  save();
  inputs.forEach((inp,i)=>{
    inp.classList.add(got[i]===want[i]?'done':'fail');
    inp.disabled = true;
    if(got[i]!==want[i]) inp.value = want[i];
  });
  SESSION.results.push({id:e.id, ok, label:'填空'});
  if(ok) SESSION.score++;
  $('qcard').innerHTML += qFeedback(e, `<div class="row mt8">${ok?'<span class="pill green">✓ 补全正确</span>':'<span class="pill red">✗ 有字母填错</span>'}</div>`);
  updateBadges();
}

/* ---------- 连线配对 ---------- */
let PAIR = null; // {pairs:[{id, syn, firstTry, done, tries}], selL, selR, wrongPair}
function renderPairBoard(qc){
  // 挑选本轮单词，并保证每个同义词唯一（避免“media”同时属于两个词导致歧义）
  const roundIds = sample(SESSION.items.slice(SESSION.idx, SESSION.idx+5).map(it=>it.id), Math.min(5, SESSION.items.length-SESSION.idx));
  const pairs = []; const usedSyn = new Set();
  for(const id of roundIds){
    const e = entryById(id);
    const cand = sample(e.synonyms, e.synonyms.length);
    let picked = null;
    for(const s of cand){ if(!usedSyn.has(s)){ picked = s; break; } }
    if(picked){ usedSyn.add(picked); pairs.push({id, syn:picked, tries:0, done:false}); }
    if(pairs.length>=5) break;
  }
  PAIR = { pairs, selL:null, selR:null };
  const left = shuffle(PAIR.pairs.map(p=>({...p})));
  const right = shuffle(PAIR.pairs.map(p=>({...p})));
  PAIR.left = left; PAIR.right = right;
  qc.innerHTML = `
    <div class="card">
      <div class="center">
        <div class="muted" style="font-size:12px">连线配对 · 本轮 ${PAIR.pairs.length} 组 · 点击左侧考点词，再点右侧同义词</div>
        <div style="font-size:13px;margin-top:4px;color:var(--sub)">配对错误会计入掌握度统计，<b>不要乱点哦</b> 😉</div>
      </div>
      <div class="grid" style="grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
        <div class="match-col" id="colL">${PAIR.left.map((p,i)=>`
          <div class="match-item" data-li="${i}" data-id="${p.id}">
            <span class="row" style="justify-content:space-between;gap:8px"><span>${esc(entryById(p.id).word)}</span>${spkMini(entryById(p.id).word)}</span>
          </div>`).join('')}</div>
        <div class="match-col" id="colR">${PAIR.right.map((p,i)=>`
          <div class="match-item" data-ri="${i}" data-syn="${esc(p.syn)}">
            <span class="row" style="justify-content:space-between;gap:8px"><span>${esc(p.syn)}</span>${spkMini(p.syn)}</span>
          </div>`).join('')}</div>
      </div>
      <div class="center mt16"><div class="muted" id="pairStatus"></div></div>
    </div>`;
  document.querySelectorAll('#colL .match-item').forEach(el=>el.addEventListener('click',()=>pairPickL(el)));
  document.querySelectorAll('#colR .match-item').forEach(el=>el.addEventListener('click',()=>pairPickR(el)));
}
function pairPickL(el){
  if(el.classList.contains('paired')) return;
  document.querySelectorAll('#colL .match-item').forEach(x=>x.classList.remove('sel'));
  el.classList.add('sel');
  PAIR.selL = {li:+el.dataset.li, id:+el.dataset.id};
  tryPair();
}
function pairPickR(el){
  if(el.classList.contains('paired')) return;
  document.querySelectorAll('#colR .match-item').forEach(x=>x.classList.remove('sel'));
  el.classList.add('sel');
  PAIR.selR = {ri:+el.dataset.ri, syn: el.dataset.syn};
  tryPair();
}
function tryPair(){
  if(!PAIR.selL || !PAIR.selR) return;
  const p = PAIR.pairs.find(x=>x.id===PAIR.selL.id);
  const pR = PAIR.pairs.find(x=>x.syn===PAIR.selR.syn);
  const ok = p && pR && p.id===pR.id;
  const elL = document.querySelector(`#colL [data-li="${PAIR.selL.li}"]`);
  const elR = document.querySelector(`#colR [data-ri="${PAIR.selR.ri}"]`);
  if(ok){
    p.tries++; p.done = true;
    const st = wordStat(p.id);
    if(p.tries===1){ st.syR++; playCorrect(); } else { st.syW++; playWrong(); }
    save();
    elL.classList.add('paired'); elR.classList.add('paired');
    elL.classList.remove('sel'); elR.classList.remove('sel');
    PAIR.selL=PAIR.selR=null;
    if(PAIR.pairs.every(x=>x.done)){
      const wrongTries = PAIR.pairs.reduce((s,x)=>s+Math.max(0,x.tries-1),0);
      const status = $('pairStatus');
      if(status){ status.innerHTML = wrongTries===0 ? '<span class="pill green">🎉 本轮全部一次配对成功！</span>' : `<span class="pill amber">本轮有 ${wrongTries} 次错误尝试</span>`; }
      for(let i=0;i<PAIR.pairs.length;i++){
        SESSION.results.push({id:PAIR.pairs[i].id, ok: PAIR.pairs[i].tries===1, label:'配对'});
        if(PAIR.pairs[i].tries===1) SESSION.score++;
      }
      updateBadges();
      SESSION.idx += PAIR.pairs.length;
      if(SESSION.idx >= SESSION.items.length) finishSession();
      else {
        setTimeout(()=>{ toast('进入下一轮配对'); renderSession(); }, 900);
      }
    }
  } else {
    if(p && pR) p.tries++;
    playWrong();
    elL.classList.add('shake'); elR.classList.add('shake');
    setTimeout(()=>{ if(!PAIR) return; elL.classList.remove('shake','sel'); elR.classList.remove('shake','sel'); PAIR.selL=PAIR.selR=null; }, 420);
  }
}

  if(ovFilter==='notstarted') ids = ids.filter(id=>!S.words[id]);
  if(ovFilter==='wrong') ids = ids.filter(id=>wrongSet.has(id));
  if(ovGroup!=='all' && /^[1-7]$/.test(String(ovGroup))){ const g=groupRanges()[+ovGroup-1]; if(g) ids=ids.filter(id=>id>=g.from&&id<=g.to); }
  const q = ovQuery.trim().toLowerCase();
  if(q) ids = ids.filter(id=>{ const e=entryById(id); return e.word.toLowerCase().includes(q)||e.meaning.toLowerCase().includes(q)||e.synonyms.some(s=>s.toLowerCase().includes(q)); });
  if(ovSort==='masc') ids.sort((a,b)=>mastery(a)-mastery(b));
  else if(ovSort==='mdesc') ids.sort((a,b)=>mastery(b)-mastery(a));
  else ids.sort((a,b)=>a-b);
  if(!ids.length){ body.innerHTML = '<tr><td colspan="8" class="center muted" style="padding:24px">没有符合条件的单词</td></tr>'; return; }
  body.innerHTML = ids.map(id=>{
    const e = entryById(id); const m = Math.round(mastery(id)*100);
    const mst = mastered.has(id);
    const statusTag = mst?'<span class="pill green">已掌握</span>' : (wrongSet.has(id)?'<span class="pill red">错词</span>' : (S.words[id]?'<span class="pill amber">学习中</span>':'<span class="pill" style="background:#eef1fb;color:#a5adcc">未开始</span>'));
    return `<tr>
      <td style="color:#a5adcc;font-size:12px">${e.id}</td>
      <td><div class="row"><span class="w">${esc(e.word)}</span>${speakBtn(e.id, e.word, true)}</div></td>
      <td class="phon">/${esc(e.phonetic)}/</td>
      <td>${esc(POS_CN[e.pos]||e.pos||'短语')}</td>
      <td>${esc(e.meaning)}</td>
      <td class="syncell">${e.synonyms.slice(0,3).map(s=>`<span class="tag">${esc(s)}</span>`).join('')}${e.synonyms.length>3?`<span class="tag" style="color:#4f6ef7">+${e.synonyms.length-3}</span>`:''}</td>
      <td style="white-space:nowrap"><span class="minibar"><i style="width:${m}%"></i></span> <span style="font-size:11px;color:var(--sub)">${m}%</span></td>
      <td>${statusTag}</td>
    </tr>`;
  }).join('');
}

/* ================= 进度 ================= */
function renderProgress(){
  const mastered = masteredIds().length;
  const wrong = wrongIds();
  const seenCount = Object.keys(S.words).length;
  let spT=0,spR=0,meT=0,meR=0,syT=0,syR=0,flT=0,flR=0;
  Object.values(S.words).forEach(w=>{ spT+=w.spR+w.spW; spR+=w.spR; meT+=w.meR+w.meW; meR+=w.meR; syT+=w.syR+w.syW; syR+=w.syR; flT+=w.fillR+w.fillW; flR+=w.fillR; });
  const totalA = spT+meT+syT+flT, rightA = spR+meR+syR+flR;
  const acc = totalA ? Math.round(rightA/totalA*100) : null;
  const pct = Math.round(mastered/DATA.length*100);
  const C = 2*Math.PI*54;
  const last7 = [...Array(7)].map((_,i)=>{ const d=new Date(); d.setDate(d.getDate()-(6-i)); const k=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; return S.history.filter(h=>h.date===k); });
  const maxDay = Math.max(1, ...last7.map(a=>a.length));
  $('view-progress').innerHTML = `
    <div class="card center">
      <div class="ringbox">
        <svg width="128" height="128">
          <circle cx="64" cy="64" r="54" fill="none" stroke="#e7ebf8" stroke-width="11"/>
          <circle cx="64" cy="64" r="54" fill="none" stroke="var(--brand)" stroke-width="11" stroke-linecap="round"
            stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}"/>
        </svg>
        <div class="num"><b>${mastered}</b><span>已掌握 / ${DATA.length}</span></div>
      </div>
      <div class="muted mt8">累计接触 <b>${seenCount}</b> 个考点词 · 总体正确率 ${acc==null?'—':acc+'%'}</div>
    </div>

    <div class="stat-grid">
      <div class="stat"><b style="color:var(--brand)">${spT}</b><span>书写题</span></div>
      <div class="stat"><b style="color:var(--ok)">${meT}</b><span>中文题</span></div>
      <div class="stat"><b style="color:var(--warn)">${syT}</b><span>同义题</span></div>
    </div>

    <div class="section-title">📅 近 7 天训练轮次</div>
    <div class="card">
      <div style="display:flex;align-items:flex-end;gap:8px;height:110px">
        ${last7.map((arr,i)=>{
          const d=new Date(); d.setDate(d.getDate()-(6-i));
          const label = ['日','一','二','三','四','五','六'][d.getDay()];
          const h = arr.length? Math.max(6, Math.round(arr.length/maxDay*80)) : 3;
          return `<div style="flex:1;text-align:center">
            <div style="height:${h}px;border-radius:6px 6px 0 0;background:${arr.length?'linear-gradient(180deg,var(--brand),var(--brand2))':'#e7ebf8'};display:flex;align-items:flex-start;justify-content:center;font-size:11px;color:#fff;padding-top:3px">${arr.length||''}</div>
            <div style="font-size:11px;color:var(--sub);margin-top:4px">${d.getDate()}日</div>
            <div style="font-size:10px;color:#b6bdd8">周${label}</div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="section-title">❌ 错词本（${wrong.length}）</div>
    ${wrong.length ? `
      <div style="display:flex;flex-direction:column;gap:10px">
      ${wrong.slice(0,40).map(id=>{
        const e=entryById(id); const w=S.words[id];
        const bad = w.spW+w.meW+w.syW+w.fillW;
        return `<div class="gword">
          <div class="top"><span class="w">${esc(e.word)}</span>${speakBtn(e.id, e.word)}
            <span class="grow"></span><span class="pill red">错 ${bad} 次</span>
            <button class="btn sm soft" onclick="startQuick('wrong')">再练</button>
          </div>
          <div class="mn">${esc(e.meaning)}</div>
          <div class="syns">🔁 ${e.synonyms.map(s=>`<span class="tag syn-tag">${esc(s)}${spkMini(s)}</span>`).join('')}</div>
        </div>`;}).join('')}
      </div>
      ${wrong.length>40?'<div class="muted center mt8">… 还有 '+ (wrong.length-40) +' 个，去“训练-错词”范围里攻克</div>':''}
    ` : `<div class="card center muted"><div class="bigemoji">🎉</div>太棒了，暂时没有错词！</div>`}

    <div class="section-title">📖 掌握情况一览</div>
    <div class="card">
      ${DATA.map(e=>{
        const m = Math.round(mastery(e.id)*100);
        const mst = m>=75 && wordStat(e.id).seen>=3;
        return `<div class="row" style="padding:5px 0;border-bottom:1px solid #f3f5fc">
          <span style="font-size:12px;color:#a5adcc;width:34px">${e.id}</span>
          <span style="font-weight:600;font-size:14px;width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.word)}</span>
          <div class="progress" style="height:6px"><i style="width:${m}%"></i></div>
          <span style="font-size:11px;color:var(--sub);width:56px;text-align:right">${mst?'✅':' '+m+'%'}</span>
        </div>`;
      }).join('')}
    </div>

    <div class="card center mt16">
      <div class="muted">学习数据保存在本机浏览器（localStorage）</div>
      <button class="btn bad sm mt8" onclick="if(confirm('确定要清空全部学习进度吗？此操作不可恢复。')){localStorage.removeItem('${LS_KEY}');S=defaultState();save();switchTab('home');toast('已清空学习数据');}">🗑 清空学习数据</button>
    </div>
  `;
}

/* ================= 设置 ================= */
function renderSettings(){
  const s = S.settings;
  $('view-settings').innerHTML = `
    <div class="section-title" style="margin-top:4px">发音</div>
    <div class="card">
      <div class="set-row"><label>朗读语速 <span class="sub">${Math.round(s.rate*100)}%</span></label>
        <input type="range" min="0.5" max="1.5" step="0.05" value="${s.rate}" id="setRate" style="width:150px"></div>
      <div class="set-row"><label>发音人</label>
        <select id="voiceSel" style="max-width:55%"><option value="">系统默认</option></select></div>
      <div class="set-row"><label>听写自动播放发音</label>
        <button class="toggle ${s.autoPlay?'on':''}" id="setAuto" aria-label="自动播放"></button></div>
      <div class="set-row"><label>答题音效（答对/答错）</label>
        <button class="toggle ${s.sound?'on':''}" id="setSound" aria-label="答题音效"></button></div>
      <div class="set-row"><label>发音方式</label>
        <select id="setEngine" style="max-width:52%">
          <option value="auto" ${s.engine==='auto'?'selected':''}>自动（预录音频优先，可反复朗读）</option>
          <option value="system" ${s.engine==='system'?'selected':''}>系统语音</option>
          <option value="embedded" ${s.engine==='embedded'?'selected':''}>预录音频</option>
        </select>
      </div>
      <div class="muted" style="font-size:12px;line-height:1.7">内置了全部 179 词 + 所有同义词的英音录音，用 <audio> 播放，<b>每次点击都能重复听到声音</b>（Safari 的系统语音有"只能读一次"的 bug，所以默认用预录音频）。</div>
    </div>
    <div class="section-title">训练</div>
    <div class="card">
      <div class="set-row"><label>默写/填空显示音标提示</label>
        <button class="toggle ${s.showPhon?'on':''}" id="setPhon" aria-label="显示音标"></button></div>
      <div class="set-row"><label>填空难度</label>
        <div class="submode-row" id="setFill">
          <button class="btn soft sm ${s.fillLevel==='easy'?'on':''}" data-f="easy">简单(去1-2个)</button>
          <button class="btn soft sm ${s.fillLevel==='mid'?'on':''}" data-f="mid">中等(去元音)</button>
          <button class="btn soft sm ${s.fillLevel==='hard'?'on':''}" data-f="hard">困难(去3-4个)</button>
        </div>
      </div>
    </div>
    <div class="section-title">关于</div>
    <div class="card">
      <div class="muted">
        <div style="font-size:15px;font-weight:700;color:var(--brand);margin-bottom:4px">${APP_BRAND}</div>
        <div style="font-size:12px;color:var(--sub);margin-bottom:8px">雅思听力同义词训练 v${APP_VERSION}</div>
        本训练小程序基于《剑桥雅思听力考点词真经》听力同义词替换 179 个考点词制作。<br><br>
        · 🎧 听写：听发音写词，再选中文、选同义替换<br>
        · ✍️ 默写：看中文/音标凭记忆写词，<b>不提供临摹提示</b><br>
        · 🔗 同义匹配：考点词与真题同义词双向绑定<br>
        · 🧩 拆词填空：去掉字母后填空补全<br><br>
        发音使用浏览器内置的语音合成（Web Speech API），请允许浏览器发声。数据仅保存在本地。
      </div>
    </div>
  `;
  const rate = $('setRate');
  rate.addEventListener('input',()=>{ s.rate = +rate.value; save(); renderSettings(); });
  const auto = $('setAuto'); auto.addEventListener('click',()=>{ s.autoPlay=!s.autoPlay; save(); renderSettings(); });
  const snd = $('setSound'); snd.addEventListener('click',()=>{ s.sound=!s.sound; save(); renderSettings(); });
  const phon = $('setPhon'); phon.addEventListener('click',()=>{ s.showPhon=!s.showPhon; save(); renderSettings(); });
  document.querySelectorAll('#setFill .btn').forEach(b=>b.addEventListener('click',()=>{ s.fillLevel=b.dataset.f; save(); renderSettings(); }));
  const vs = $('voiceSel');
  vs.addEventListener('change',()=>{ s.voiceURI = vs.value; save(); });
  populateVoiceSelect();
  const eng = $('setEngine');
  if(eng) eng.addEventListener('change',()=>{ s.engine = eng.value; save(); toast('发音方式已切换：' + eng.options[eng.selectedIndex].text); });
}

/* ================= 启动 ================= */
loadVoices();
const _bl = $('brandLine'); if(_bl) _bl.textContent = APP_BRAND + ' · v' + APP_VERSION;
const _ft = $('appFooter'); if(_ft) _ft.textContent = APP_BRAND + ' · 雅思听力同义词训练 · v' + APP_VERSION;
renderHome();
updateBadges();
</script>
</body>
</html>
